# Ephemeral stack for CI / local confirmation of migrate → start → /health → /ready
# Usage: docker compose -f docker-compose.ci.yml up --build --abort-on-container-exit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tawala
      POSTGRES_PASSWORD: tawala
      POSTGRES_DB: tawala
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tawala -d tawala"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: TawalaCI
      APP_VERSION: "0.0.1"
      ENVIRONMENT: development
      DATABASE_NAME: tawala
      DATABASE_USER: tawala
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD: tawala
      SECRET_KEY: ci-secret-key-32-characters-min!!
      ALGORITHM: HS256
      ISSUER: tawala-ci
      AUDIENCE: tawala-ci
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      PIN_TOKEN_EXPIRE_HOURS: "8"
      ADMIN_NAME: CI Admin
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-pass-123
      RESOURCE_SERVER: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000
      RESEND_API_KEY: re_ci_dummy
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
