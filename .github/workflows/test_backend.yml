name: Test Backend

on:
  push:
    branches: [main, master, dev]
    paths:
      - "backend/**"
      - ".github/workflows/test_backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/test_backend.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        working-directory: backend
        env:
          APP_NAME: TawalaTest
          APP_VERSION: "0.0.1"
          ENVIRONMENT: development
          DATABASE_NAME: test_db
          DATABASE_USER: test_user
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_PASSWORD: test_pass
          SECRET_KEY: test-secret-key-32-chars-long!!
          ISSUER: test
          AUDIENCE: test
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          PIN_TOKEN_EXPIRE_HOURS: "8"
          ADMIN_NAME: Test Admin
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: testpass123
          RESOURCE_SERVER: http://localhost:8000
          ALLOWED_ORIGINS: http://localhost:3000
          RESEND_API_KEY: test_key
          REDIS_URL: memory://
          FRONTEND_URL: http://localhost:3000
        run: |
          set -euo pipefail
          if [ ! -f .env.example ]; then
            echo "backend/.env.example is missing — required for Settings + CI"
            exit 1
          fi
          # Export KEY=value pairs from the maintained template (source of truth).
          # Values with spaces are supported; comments and blank lines are skipped.
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key="${line%%=*}"
            val="${line#*=}"
            key="$(echo "$key" | xargs)"
            [ -n "$key" ] || continue
            export "$key=$val"
          done < .env.example
          # CI-safe overrides (no external services)
          export APP_NAME=TawalaTest
          export ENVIRONMENT=development
          export DATABASE_NAME=test_db
          export DATABASE_USER=test_user
          export DATABASE_PASSWORD=test_pass
          export SECRET_KEY=test-secret-key-32-chars-long!!
          export ADMIN_EMAIL=admin@test.com
          export ADMIN_PASSWORD=testpass123
          export RESEND_API_KEY=test_key
          export REDIS_URL=memory://
          export FRONTEND_URL=http://localhost:3000
          pytest testing/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          if-no-files-found: ignore
