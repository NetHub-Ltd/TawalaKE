# Build tawala-core image on core/v2. Never tags as product tawala-api.
# No runtime smoke here — app requires a live DB (FastAPI lifespan + start.sh).
name: Core Image

on:
  push:
    branches: [core/v2, "core/**"]
  pull_request:
    branches: [core/v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Guard — forbid product image name
        run: |
          echo "tawala-core:${{ steps.meta.outputs.sha }}" | grep -vq tawala-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            tawala-core:${{ steps.meta.outputs.sha }}
            tawala-core:core-v2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Core registry
        if: github.event_name == 'push' && vars.CORE_IMAGE_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CORE_IMAGE_REGISTRY }}
          username: ${{ secrets.CORE_IMAGE_USERNAME }}
          password: ${{ secrets.CORE_IMAGE_PASSWORD }}

      - name: Push tawala-core tags only
        if: github.event_name == 'push' && vars.CORE_IMAGE_REGISTRY != ''
        run: |
          REG="${{ vars.CORE_IMAGE_REGISTRY }}"
          SHA="${{ steps.meta.outputs.sha }}"
          docker tag "tawala-core:${SHA}" "${REG}/tawala-core:${SHA}"
          docker tag "tawala-core:${SHA}" "${REG}/tawala-core:core-v2"
          docker push "${REG}/tawala-core:${SHA}"
          docker push "${REG}/tawala-core:core-v2"
