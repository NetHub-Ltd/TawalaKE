name: Test Frontend

on:
  push:
    branches: [main, master, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/test_frontend.yml"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/test_frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: ESLint (strict) + Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (strict — zero warnings)
        run: npm run lint -- --max-warnings 0

      - name: Production build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          NEXT_TELEMETRY_DISABLED: "1"
          # Placeholders so next build / auth module can evaluate without real secrets
          AUTH_SECRET: "ci-build-placeholder-secret-min-32-chars-xx"
          NEXTAUTH_SECRET: "ci-build-placeholder-secret-min-32-chars-xx"
          AUTH_URL: "http://localhost:3000"
          NEXTAUTH_URL: "http://localhost:3000"
          BACKEND_URL: "http://127.0.0.1:8000/api/v1"
        run: npm run build
