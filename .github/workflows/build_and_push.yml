name: Build & Push Backend to GHCR

# Versioned images are produced from git tags (v*).
# Tags are created automatically on main by auto_tag.yml when backend/** changes.
# PRs still build without pushing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "backend/**"

jobs:
  build-backend:
    uses: daviekaranja/workflows/.github/workflows/build_and_push_v2.yaml@master
    with:
      image_name: tawala-api
      registry: ghcr.io
      context: backend
      push: ${{ github.event_name != 'pull_request' }}
      platforms: "linux/amd64,linux/arm64"
    secrets: inherit
