# Create the next v0.0.N git tag on push to main when backend changes.
# Tag push triggers Build & Push (semver image tags via metadata-action).
name: Auto tag release (v0.0.x)

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"

concurrency:
  group: auto-tag-v0-0-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute and push next v0.0.N tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force origin

          # Latest tag on the v0.0.* line only (ignore v0.1.x etc.)
          LATEST="$(git tag -l 'v0.0.*' | sort -V | tail -n 1 || true)"
          if [ -z "${LATEST}" ]; then
            NEXT="v0.0.1"
          else
            # v0.0.44 -> 44
            PATCH="${LATEST##*.}"
            if ! [[ "${PATCH}" =~ ^[0-9]+$ ]]; then
              echo "Unparseable tag: ${LATEST}"
              exit 1
            fi
            NEXT="v0.0.$((PATCH + 1))"
          fi

          echo "Latest v0.0.* tag: ${LATEST:-<none>}"
          echo "Next tag: ${NEXT}"

          # Already tagged this commit with any v0.0.* — do not retag
          if git tag --points-at HEAD | grep -E '^v0\.0\.[0-9]+$' >/dev/null 2>&1; then
            echo "HEAD already has a v0.0.* tag; skipping."
            git tag --points-at HEAD
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "Tag ${NEXT} already exists; skipping."
            exit 0
          fi

          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
          echo "Pushed tag ${NEXT}"
