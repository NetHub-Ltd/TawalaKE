# Core CI — runs on core/v2 only. Does not deploy product.
name: Core CI

on:
  push:
    branches: [core/v2, "core/**"]
  pull_request:
    branches: [core/v2]

defaults:
  run:
    working-directory: backend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest -q

  # Image build is a separate optional job (M10); skeleton verifies Dockerfile syntax later.
