# Core CI — runs on core/v2 only. Does not deploy product.
# Pytest against real PostgreSQL is the sole quality gate.
name: Core CI

on:
  push:
    branches: [core/v2, "core/**"]
  pull_request:
    branches: [core/v2]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Pytest (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core_ci
          POSTGRES_DB: tawala_core_test
          # Trust local connections in the CI service network (no secret to scan).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_ci -d tawala_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      LOG_LEVEL: DEBUG
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: core_ci
      DB_PASSWORD: ""
      DB_NAME: tawala_core_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (real PostgreSQL)
        run: pytest -q
