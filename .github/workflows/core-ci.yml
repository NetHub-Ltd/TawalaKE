# Core CI — runs on core/v2 only. Does not deploy product.
name: Core CI

on:
  push:
    branches: [core/v2, "core/**"]
  pull_request:
    branches: [core/v2]

defaults:
  run:
    working-directory: backend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tawala
          POSTGRES_PASSWORD: tawala
          POSTGRES_DB: tawala_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tawala -d tawala_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://tawala:tawala@localhost:5432/tawala_core_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest (real PostgreSQL)
        run: pytest -q
